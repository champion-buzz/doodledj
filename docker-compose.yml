services:
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      MONGO_URI: mongodb://mongo:27017/doodledj
      # Use a local open-source model through Ollama running on your machine:
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-llama3.2:3b}
    depends_on: [mongo]
  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]
volumes:
  mongo-data:
